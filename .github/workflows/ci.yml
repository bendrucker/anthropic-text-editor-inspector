name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The str_replace matcher only works if the serializer is a fixed point.
      - name: Markdown roundtrip
        run: bun run roundtrip

      - name: Build
        run: bun run build

      - name: Build single file
        run: bun run build:single
