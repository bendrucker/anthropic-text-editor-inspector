name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The str_replace matcher only works if the serializer is a fixed point.
      - name: Markdown roundtrip
        run: bun run roundtrip

      - name: Conversation history
        run: bun run conversation

      - name: Build
        run: bun run build

      - name: Build single file
        run: bun run build:single

  # The desktop build is what organizations that refuse browser requests use, so
  # it cannot be allowed to break unnoticed between releases.
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # No extra targets: this is a host-only smoke test. The release build
      # installs both Darwin targets because it bundles a universal binary.
      - uses: ./.github/actions/desktop-toolchain

      # `generate_context!` reads the bundle config, which points at dist/.
      - run: bun run build

      - name: Check the desktop crate
        run: cargo check --manifest-path src-tauri/Cargo.toml
