name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/desktop-toolchain
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # The tag names the release and package.json labels the bundle, and
      # nothing reconciles the two. Checked before the build so a mislabelled
      # DMG is never produced rather than caught after it is signed.
      - name: Versions agree
        run: bun run versions

      # One universal DMG covers both architectures, so nobody has to know
      # which Mac they have.
      #
      # This only builds. Publishing is a separate step below, so a manual run
      # exercises everything a tag does apart from creating the release.
      - uses: tauri-apps/tauri-action@v0
        id: build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target universal-apple-darwin

      # Tauri notarizes and staples the app, then builds the disk image around
      # it and never submits that. Opening an unstapled image sends Gatekeeper
      # to the network, which fails confusingly on a machine that is offline or
      # behind a filtering proxy. One submission covers the image and the app
      # inside it.
      - name: Notarize the disk image
        id: dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          dmg=$(jq -er 'map(select(endswith(".dmg"))) | first' <<< "$ARTIFACT_PATHS")
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
          # `submit --wait` exits zero on a rejected submission, so the staple
          # and this check are what actually fail the job.
          xcrun stapler validate "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      # A manual run produces no release, so keep the DMG reachable for
      # checking that the signature and notarization survived CI.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Draft the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes 'A signed, notarized macOS build. The web version is at
          https://bendrucker.github.io/anthropic-text-editor-inspector/

          The desktop build calls the API from Rust, so it works with keys
          whose organization refuses browser requests.'
