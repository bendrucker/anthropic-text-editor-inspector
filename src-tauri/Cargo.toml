[package]
name = "anthropic-text-editor-inspector"
version = "0.1.0"
description = "Watch Claude edit a document through a streaming text editor tool."
authors = ["Ben Drucker"]
license = "MIT"
repository = "https://github.com/bendrucker/anthropic-text-editor-inspector"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
